changelog:
  categories:
    - title: "🚀 New Features"
      labels:
        - "feature"
        - "enhancement"
    - title: "🐛 Bug Fixes"
      labels:
        - "fix"
        - "bug"
    - title: "🌐 Localization"
      labels:
        - "localization"
        - "i18n"
    - title: "🧰 Maintenance & CI"
      labels:
        - "chore"
        - "ci"
        - "build"
        - "dependencies"
    - title: "📖 Documentation"
      labels:
        - "documentation"
        - "docs"
    - title: "💬 Other Changes"
      labels:
        - "*"
